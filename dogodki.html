<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pretekli dogodki – Caffe Mušketir</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4e9d8 url(images/Background\ \(2\).png) repeat; }

    .anim { opacity: 0; transform: translateY(28px); transition: opacity 0.65s ease, transform 0.65s ease; }
    .anim.visible { opacity: 1; transform: none; }
    .anim-d1 { transition-delay: 0.1s; }
    .anim-d2 { transition-delay: 0.2s; }
    .anim-d3 { transition-delay: 0.3s; }
    @media (prefers-reduced-motion: reduce) { .anim { opacity: 1; transform: none; transition: none; } }

    nav {
      position: fixed; top: 0; left: 0; width: 100%;
      background: white; border-bottom: 1px solid #ddd;
      z-index: 1000; display: flex; justify-content: space-between;
      align-items: center; padding: 10px 20px;
    }
    nav img { height: 60px; }
    .nav-links { display: flex; gap: 15px; flex-wrap: wrap; justify-content: flex-end; }
    .nav-links a {
      text-decoration: none; color: #c21807; font-weight: bold;
      font-size: 16px; padding: 6px 10px; border-radius: 6px; transition: background 0.2s;
    }
    .nav-links a:hover { background: #fef0ee; }

    .burger {
      display: none; flex-direction: column; justify-content: center;
      gap: 5px; background: none; border: none; cursor: pointer; padding: 8px;
    }
    .burger span { display: block; width: 26px; height: 3px; background: #c21807; border-radius: 2px; transition: transform 0.3s ease, opacity 0.3s ease; }
    .burger.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    .burger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .burger.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

    .content { padding: 100px 20px 60px; text-align: center; }
    .content h2 { color: #c21807; margin-bottom: 10px; }

    .event-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; margin-top: 30px; }

    .event-card {
      max-width: 380px; width: 100%; text-align: center; border-radius: 10px;
      overflow: hidden; background: white; box-shadow: 0 4px 14px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s; text-decoration: none;
    }
    .event-card:hover { transform: scale(1.04); box-shadow: 0 10px 28px rgba(0,0,0,0.17); }
    .event-card img { width: 100%; height: auto; display: block; }
    .event-card-title { padding: 12px 10px; font-weight: bold; font-size: 17px; color: #c21807; }

    .back-to-main-button {
      display: inline-block; margin-top: 36px; padding: 10px 24px;
      background: #c21807; color: white; text-decoration: none;
      border-radius: 6px; font-size: 16px; transition: background 0.3s, transform 0.2s;
    }
    .back-to-main-button:hover { background: #a60f05; transform: translateY(-2px); }

    @media screen and (max-width: 768px) {
      nav { padding: 8px 16px; }
      nav img { height: 50px; }
      .burger { display: flex; }
      nav .nav-links {
        display: none; flex-direction: column;
        position: absolute; top: 100%; left: 0; width: 100%;
        background: white; border-top: 1px solid #eee;
        box-shadow: 0 6px 20px rgba(0,0,0,0.13); padding: 6px 0; gap: 0;
      }
      nav .nav-links.open { display: flex; animation: slideDown 0.22s ease; }
      @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
      nav .nav-links a { padding: 13px 22px; font-size: 16px; border-bottom: 1px solid #f5ede4; border-radius: 0; }
      nav .nav-links a:last-child { border-bottom: none; }

      .event-grid { flex-direction: column; align-items: center; }
      .event-card { max-width: 90%; }
    }
  </style>
</head>
<body>

  <nav id="mainNav">
    <a href="index.html"><img src="images/IMG_1068-Photoroom.png" alt="Caffe Mušketir" loading="eager"></a>
    <button class="burger" id="burger" aria-label="Odpri meni" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="navLinks">
      <a href="index.html#pocetna">Domov</a>
      <a href="index.html#dogodki">Aktualno</a>
      <a href="index.html#prostor">Prostor</a>
      <a href="index.html#onama">O nas</a>
      <a href="index.html#cenik">Cenik</a>
      <a href="index.html#galerija">Galerija</a>
      <a href="index.html#kontakt">Kontakt</a>
    </div>
  </nav>

  <section class="content">
    <h2 class="anim">Pretekli dogodki</h2>
    <div class="event-grid">
      <a href="dogodek2.html" class="event-card anim anim-d1">
        <img src="images/kafansko.png" alt="Kafansko veče" loading="lazy">
        <div class="event-card-title">Kafansko veče</div>
      </a>
      <a href="dogodek1.html" class="event-card anim anim-d2">
        <img src="images/Otvoritev.png" alt="Otvoritev" loading="lazy">
        <div class="event-card-title">Otvoritev</div>
      </a>
      <a href="dogodek0.html" class="event-card anim anim-d3">
        <img src="images/PRENOVA.png" alt="Prenova" loading="lazy">
        <div class="event-card-title">Prenova</div>
      </a>
    </div>
    <div class="anim anim-d3">
      <a href="index.html" class="back-to-main-button">Nazaj na Aktualno</a>
    </div>
  </section>

  <script>
  (function() {
    const burger   = document.getElementById('burger');
    const navLinks = document.getElementById('navLinks');
    const mainNav  = document.getElementById('mainNav');
    burger.addEventListener('click', () => {
      const open = navLinks.classList.toggle('open');
      burger.classList.toggle('open', open);
      burger.setAttribute('aria-expanded', String(open));
    });
    navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
      navLinks.classList.remove('open'); burger.classList.remove('open');
      burger.setAttribute('aria-expanded', 'false');
    }));
    document.addEventListener('click', e => {
      if (!mainNav.contains(e.target)) {
        navLinks.classList.remove('open'); burger.classList.remove('open');
        burger.setAttribute('aria-expanded', 'false');
      }
    });
    const obs = new IntersectionObserver(en => {
      en.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
    }, { threshold: 0.12 });
    document.querySelectorAll('.anim').forEach(el => obs.observe(el));
  })();
  </script>

</body>
</html>
